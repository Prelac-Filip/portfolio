title: Special place for a special person
description: A hidden page, dedicated to my favourite person in the whole world, that is my Aisha.
about:
  title: About us
  description: | 
    We are two cutie pattooties that love eachother very much, even with such limited expewience.
reasons:
  title: Why is she the biggest cutie pattootie?
  description: |
    Just a few examples of why she is the love of my life:
  items:
    - label: Loving
    - label: Cute
    - label: Pattoot
