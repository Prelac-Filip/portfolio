special:
  title: What makes her really special?
  description: Even when I'm making the dumbest jokes she laughs at them. When I'm inconsiderate she's always there when I need her. She believes in me and in my dreams. She is hugging, kissing, and massaging me even when she is tired and full of my crap. She is simply the best.
end:
  title: I love you, my sweet little snow leopard.
  description: With the most love, Fićo
